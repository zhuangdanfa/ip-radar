name: 每日采集与上升榜

on:
  schedule:
    - cron: "0 10 * * *" # 每天 UTC 10:00（北京时间 18:00）
  workflow_dispatch:
    inputs:
      days:
        description: "Wikipedia 回溯天数（第一次运行填 400，用于回测）"
        default: "14"
      sources:
        description: "数据源，逗号分隔"
        default: "wikipedia,trends,youtube,reddit"

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 采集
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: >
          python -m ipradar collect
          --days "${{ github.event.inputs.days || '14' }}"
          --sources "${{ github.event.inputs.sources || 'wikipedia,trends,youtube,reddit' }}"
      - name: 生成上升榜
        run: python -m ipradar report
      - name: 提交数据
        run: |
          git config user.name "ip-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "没有新数据"; exit 0; fi
          git commit -m "数据更新 $(date -u +%F)"
          git push
