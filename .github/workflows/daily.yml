name: 每日采集与上升榜

on:
  schedule:
    - cron: "0 10 * * *" # 每天 UTC 10:00（北京时间 18:00）
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数（第一次运行填 400：Wikipedia 回填一年多，B站回填 26 周）"
        default: "14"
      sources:
        description: "数据源，逗号分隔；留空表示全部（北美 wikipedia,trends,youtube,reddit；中国 bilibili）"
        default: ""
      regions:
        description: "地区，空格分隔：na 北美，cn 中国"
        default: "na cn"

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 采集
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DAYS: ${{ github.event.inputs.days || '14' }}
          SOURCES: ${{ github.event.inputs.sources }}
          REGIONS: ${{ github.event.inputs.regions || 'na cn' }}
        # 一个地区采集失败不影响另一个地区，已采到的数据照常提交
        run: |
          for r in $REGIONS; do
            python -m ipradar collect --region "$r" --days "$DAYS" ${SOURCES:+--sources "$SOURCES"} \
              || echo "::warning::$r 采集失败"
          done
      - name: 生成上升榜
        run: |
          python -m ipradar report --region na
          python -m ipradar report --region cn
      - name: 提交数据
        run: |
          git config user.name "ip-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "没有新数据"; exit 0; fi
          git commit -m "数据更新 $(date -u +%F)"
          git push
